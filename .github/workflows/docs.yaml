name: docs
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+a[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+b[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+rc[0-9]+'
  workflow_dispatch:
    inputs:
      target:
        description: 'Site to build and deploy'
        type: choice
        options:
        - dev
        - main
        - dryrun
        required: true
        default: dryrun
      version:
        description: 'Version tag X.X.X (required if target is main)'
        required: false
  pull_request:
    types: [opened, synchronize, reopened, labeled]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash -e {0}

jobs:
  setup:
    name: setup:docs
    runs-on: ubuntu-latest
    permissions:
      checks: read
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - name: check if docs should be built
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HAS_LABEL: ${{ github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'run-docs-ci') }}
          OTHER_LABEL: ${{ github.event.action == 'labeled' && github.event.label.name != 'run-docs-ci' }}
        run: |
          run=$HAS_LABEL
          if [ "$run" = true ] && [ "$OTHER_LABEL" = true ]; then
            # This run hides the earlier run's checks, so only skip if the docs already built for this commit
            built=$(gh api "repos/$GH_REPO/commits/$HEAD_SHA/check-runs?check_name=build:docs" \
              --jq '[.check_runs[] | select(.conclusion != "skipped")] | max_by(.started_at).conclusion == "success"')
            [ "$built" = true ] && run=false
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"

  docs_build:
    name: build:docs
    runs-on: 'macos-latest'
    needs: [setup]
    if: needs.setup.outputs.run == 'true'
    timeout-minutes: 120
    env:
      DISPLAY: ":99.0"
      VERSION: ${{ inputs.version }}
    steps:
      - name: Validate version
        if: ${{ inputs.target == 'main' }}
        run: |
          if [[ -z "$VERSION" || ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "❌ 'version' is required and must match format X.X.X (e.g. 0.11.1) when target is 'main'"
            exit 1
          fi
      - uses: holoviz-dev/holoviz_tasks/pixi-install@17107a157b32cc1bd2a09c71fbdbc74603efdb40 # v1.0.15
        with:
          environments: docs
      - name: Build documentation
        run: pixi run -e docs docs-build
      - name: Upload docs artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hvplot-docs
          path: ./builtdocs/
          if-no-files-found: error
      - name: report failure
        if: failure()
        run: cat /tmp/sphinx-*.log | tail -n 100

  docs_publish:
    name: publish:docs
    runs-on: 'ubuntu-latest'
    needs: [docs_build]
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: hvplot-docs
          path: ./builtdocs/
      - uses: holoviz-dev/holoviz_tasks/docs-publish@17107a157b32cc1bd2a09c71fbdbc74603efdb40 # v1.0.15
        with:
          s3-url: s3://hvplot.holoviz.org
          s3-cloudfront-id: E13QSRL36ILGWH
          s3-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          s3-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          version: ${{ inputs.version }}

  result_docs_build:
    name: result:docs
    needs: [setup, docs_build, docs_publish]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: check for failures
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: echo job failed && exit 1
