name: tests
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+a[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+b[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+rc[0-9]+'
  pull_request:
    branches:
    - '*'
  workflow_dispatch:
    inputs:
      target:
        description: "How much of the test suite to run"
        type: choice
        default: default
        options:
          - default
          - full
          - downstream
      cache:
        description: "If disabled, upstream packages are updated"
        type: boolean
        default: true

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash -e {0}

env:
  UPSTREAM_PACKAGES: "holoviews panel bokeh param colorcet"

jobs:
  pre_commit:
    name: pre-commit
    runs-on: 'ubuntu-latest'
    steps:
      - uses: holoviz-dev/holoviz_tasks/pre-commit@17107a157b32cc1bd2a09c71fbdbc74603efdb40 # v1
        env:
          SKIP: pixi

  setup:
    name: setup:test
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ env.MATRIX }}
      matrix_option: ${{ env.MATRIX_OPTION }}
    steps:
      - name: Set matrix option
        env:
          GITHUB_EVENT_INPUTS_TARGET: ${{ github.event.inputs.target }}
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == 'workflow_dispatch' ]]; then
            OPTION=${GITHUB_EVENT_INPUTS_TARGET}
          elif [[ "${GITHUB_EVENT_NAME}" == 'pull_request' && "${GITHUB_HEAD_REF}" == 'renovate/lock-file-maintenance-pixi-lock' ]]; then
            OPTION="full"
          elif [[ "${GITHUB_EVENT_NAME}" == 'push' && "${GITHUB_REF_TYPE}" == 'tag' ]]; then
            OPTION="full"
          else
            OPTION="default"
          fi
          echo "MATRIX_OPTION=$OPTION" >> $GITHUB_ENV
      - name: Set test matrix with 'default' option
        if: env.MATRIX_OPTION == 'default'
        run: |
          MATRIX=$(jq -nsc '{
              "os": ["ubuntu-latest", "macos-latest", "windows-latest"],
              "environment": ["test-310", "test-314"],
              "exclude": [
                {
                  "environment": "test-310",
                  "os": "macos-latest"
                }
              ]
          }')
          echo "MATRIX=$MATRIX" >> $GITHUB_ENV
      - name: Set test matrix with 'full' option
        if: env.MATRIX_OPTION == 'full'
        run: |
          MATRIX=$(jq -nsc '{
              "os": ["ubuntu-latest", "macos-latest", "windows-latest"],
              "environment": ["test-310", "test-313", "test-314"],
              "include": [
                {
                  "environment": "test-311",
                  "os": "ubuntu-latest"
                },
                {
                  "environment": "test-312",
                  "os": "ubuntu-latest"
                }
              ],
              "exclude": [
                {
                  "environment": "test-310",
                  "os": "macos-latest"
                }
              ]
          }')
          echo "MATRIX=$MATRIX" >> $GITHUB_ENV
      - name: Set test matrix with 'downstream' option
        if: env.MATRIX_OPTION == 'downstream'
        run: |
          MATRIX=$(jq -nsc '{
              "os": ["ubuntu-latest"],
              "environment": ["test-313"]
          }')
          echo "MATRIX=$MATRIX" >> $GITHUB_ENV

  pixi_lock_diff:
    name: pixi-diff
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: holoviz-dev/holoviz_tasks/pixi-diff@17107a157b32cc1bd2a09c71fbdbc74603efdb40 # v1

  unit_test_suite:
    name: unit:${{ matrix.environment }}:${{ matrix.os }}
    needs: [pre_commit, setup]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.setup.outputs.matrix) }}
    timeout-minutes: 90
    env:
      ENV: ${{ matrix.environment }}
      MATRIX_OPTION: ${{ needs.setup.outputs.matrix_option }}
    steps:
      - uses: holoviz-dev/holoviz_tasks/pixi-install@17107a157b32cc1bd2a09c71fbdbc74603efdb40 # v1
        with:
          environments: ${{ matrix.environment }}
      - name: Update upstream packages
        if: github.event.inputs.cache == 'false'
        run: |
          pixi update ${UPSTREAM_PACKAGES} -e "${ENV}"
      - name: Test Unit
        run: pixi run -e "${ENV}" test-unit-cov
      - name: Test Geo
        if: ${{ matrix.environment != 'test-314' }}
        run: pixi run -e "${ENV}" test-unit-geo-cov
      - name: Test Examples
        run: |
          if [[ "${MATRIX_OPTION}" == "full" ]]; then
            HVPLOT_INCLUDE_SLOW_EXAMPLES=1 pixi run -e "${ENV}" test-example
          else
            pixi run -e "${ENV}" test-example
          fi
      - uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

  core_test_suite:
    name: core:${{ matrix.environment }}:${{ matrix.os }}
    needs: [pre_commit, setup]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ["ubuntu-latest"]
        environment: ["test-core"]
    timeout-minutes: 120
    env:
      ENV: ${{ matrix.environment }}
    steps:
      - uses: holoviz-dev/holoviz_tasks/pixi-install@17107a157b32cc1bd2a09c71fbdbc74603efdb40 # v1
        with:
          environments: ${{ matrix.environment }}
      - name: Update upstream packages
        if: github.event.inputs.cache == 'false'
        run: |
          pixi update ${UPSTREAM_PACKAGES} -e "${ENV}"
      - name: Test Unit
        run: pixi run -e "${ENV}" test-unit

  result_test_suite:
    name: result:test
    needs: [unit_test_suite, core_test_suite]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: check for failures
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: echo job failed && exit 1
