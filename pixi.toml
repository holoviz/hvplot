[workspace]
name = "hvplot"
channels = ["pyviz/label/dev",  "conda-forge"]
platforms = ["linux-64", "osx-arm64", "win-64"]
preview = ["pixi-build"]
requires-pixi = ">=0.68.1"

[package]
name = "hvplot"
version = "9999.0.0" # dynamic versioning: https://github.com/prefix-dev/pixi/issues/5360

[package.build]
backend = { name = "pixi-build-python", version = ">=0.4.4" }

[package.host-dependencies]
hatchling = "*"
hatch-vcs = "*"

[environments]
default = [
    "required",
    "py312",
    "optional",
    "test-core",
    "test-example",
    "test-unit-task",
    "lint",
    "dev",
]

[environments.test-310]
features = ["required", "py310", "optional", "test-core", "test-example", "test-unit-task"]
no-default-feature = true

[environments.test-311]
features = ["required", "py311", "optional", "test-core", "test-example", "test-unit-task"]
no-default-feature = true

[environments.test-312]
features = ["required", "py312", "optional", "test-core", "test-example", "test-unit-task"]
no-default-feature = true

[environments.test-313]
features = ["required", "py313", "optional", "test-core", "test-example", "test-unit-task"]
no-default-feature = true

[environments.test-314]
features = ["required", "py314", "optional", "test-core", "test-example", "test-unit-task"]
no-default-feature = true

[environments.test-core]
features = ["required", "py314", "test-core", "test-unit-task"]
no-default-feature = true

[environments.docs]
features = ["required", "py313", "optional", "doc"]
no-default-feature = true

[environments.build]
features = ["required", "py313", "build"]
no-default-feature = true

[environments.lint]
features = ["lint"]
no-default-feature = true

[feature.required.dependencies]
nomkl = "*"
hvplot = { path = "." }
# Required
bokeh = ">=3.1"
colorcet = ">=2"
holoviews = ">=1.19.0"
numpy = ">=1.21"
packaging = "*"
pandas = ">=1.3"
panel = ">=1.0"
param = ">=1.12.0,<3.0"

[feature.required.tasks]
download-data = 'python scripts/download_data.py'
setup-dev = { depends-on = ["download-data", "lint-install"] }
sync-git-tags = 'python scripts/sync_git_tags.py hvplot'

[feature.required.activation.env]
PYTHONIOENCODING = "utf-8"

[feature.py310.dependencies]
python = "3.10.*"

[feature.py311.dependencies]
python = "3.11.*"

[feature.py312.dependencies]
python = "3.12.*"

[feature.py312.activation.env]
COVERAGE_CORE = "sysmon"

[feature.py313.dependencies]
python = "3.13.*"

[feature.py313.activation.env]
COVERAGE_CORE = "sysmon"

[feature.py314.dependencies]
python = "3.14.*"

[feature.py314.activation.env]
COVERAGE_CORE = "sysmon"

# =================== DEV ===================

[feature.dev.dependencies]
jupyterlab = "*"
jupyterlab-myst = "*"
pip = "*"
setuptools_scm = ">=6"

[feature.dev.tasks]
lab = 'jupyter lab'

# =================== OPTIONAL ===================

[feature.optional.dependencies]
bokeh_sampledata = ">=2025.0"
cartopy = "*"
cftime = "*"
dask-core = "*"
pyarrow = "*"
datashader = ">=0.6.5"
duckdb = "*"
fiona = "*"
# In 0.9 fugue added the sql extra but didn't add a fugue-sql conda package,
# removing the sql deps from core fugue. Adding them manually here.
fugue-sql-antlr = ">=0.2.4"
sqlglot = "*"
jinja2 = "*"
# fugue[sql] = "*"
fugue = "*"
# end fugue
geodatasets = ">=2023.12.0"
geopandas = "*"
geoviews-core = ">=1.9.0"  # geoviews
hvsampledata = ">=0.1.4a2"
ibis-duckdb = ">=9.0.0"  # ibis-framework[duckdb]
intake = ">=0.6.5,<2.0.0" # Kept only for deprecation tests.
ipywidgets = "*"
matplotlib = "*"
netcdf4 = "*"
networkx = ">=2.6.3"
notebook = ">=5.4"
numba = ">=0.51.0"
numpydoc = "*"
pillow = ">=8.2.0"
plotly = "*"
polars = "*"
pooch = ">=1.6.0"
# graphviz is difficult to install with pip, ok with conda.
pygraphviz = "*"
pyproj = "*"
rasterio = "*"
rioxarray = "*"
s3fs = ">=2022.1.0"
scikit-image = ">=0.17.2"
scikit-learn = ">=1.4.0"
scipy = ">=1.5.3"
selenium = ">=3.141.0"
spatialpandas = ">=0.4.3"
streamz = ">=0.3.0"
xarray = ">=0.18.2"
xugrid = ">=0.15.0"
xyzservices = ">=2022.9.0"

# =================== TESTS ===================

[feature.test-core.dependencies]
parameterized = "*"
psutil = "*"
pytest = "*"
pytest-cov = "*"
pytest-xdist = "*"

[feature.test-unit-task.tasks] # So it is not showing up in environments without tests
test-unit = { cmd = 'pytest hvplot/tests -n logical --dist loadgroup', description = "Run the unit tests" }

[feature.test-example.dependencies]
nbval = "*"

[feature.test-example.tasks]
test-example = { cmd = 'pytest -n logical --dist loadscope --nbval-lax -p no:python doc', description = "Run the example notebooks" }

# =================== DOCS ====================

[feature.doc]
channels = [
    # To get dev HoloViews, not always needed.
    "pyviz/label/dev",
    # To get dev nbsite, not always needed.
    "pyviz/label/tooling_dev",
    "conda-forge"
]
[feature.doc.dependencies]
nbsite = ">=0.10.0a0"
sphinxext-rediraffe = "*"
numpydoc = "*"
sphinxcontrib-mermaid = "*"

[feature.doc.activation.env]
MOZ_HEADLESS = "1"
MPLBACKEND = "Agg"
DISPLAY = ":99.0"
HVPLOT_PATCH_PLOT_DOCSTRING_SIGNATURE = "false"

[feature.doc.tasks]
docs-build-sphinx = 'sphinx-build -j auto -b html doc builtdocs'
_docs_markdown = 'python -m nbsite build-llms --config scripts/llms_config.py'
docs-build = { depends-on = ["docs-build-sphinx", "_docs_markdown"] }
docs-server = 'python -m http.server 5500 --directory ./builtdocs'

# ================== BUILD ====================

[feature.build.dependencies]
python-build = "*"
conda-build = "*"
anaconda-client = "*"

[feature.build.tasks]
build-conda = 'bash scripts/conda/build.sh'
publish-conda = 'anaconda'
build-pip = 'python -m build .'

# =================== LINT ====================

[feature.lint.dependencies]
pre-commit = "*"

[feature.lint.tasks]
lint = 'pre-commit run --all-files'
lint-install = 'pre-commit install'
